<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>엘리멘탈 클래시</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --fire-color: #ff4757;
            --water-color: #1e90ff;
            --earth-color: #2ed573;
            --panel-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Pretendard', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #1e293b, var(--bg-dark));
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 게임 보드 */
        .game-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* 플레이어 구역 */
        .player-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.4s ease;
        }

        .player2 {
            transform: rotate(180deg);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .player1 {
            border-top: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* 내 턴일 때 배경 하이라이트 */
        .active-turn.player1 { background: radial-gradient(circle at bottom, rgba(255,255,255,0.1), transparent 70%); }
        .active-turn.player2 { background: radial-gradient(circle at bottom, rgba(255,255,255,0.1), transparent 70%); }

        .score-board {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        
        .score-board span {
            font-size: 36px;
            color: #ffd700;
        }

        /* 3D 카드 디자인 */
        .card-container {
            width: 140px;
            height: 200px;
            perspective: 1000px; /* 3D 효과를 위한 원근감 */
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card-container.revealed .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* 카드 뒷면 (숨겨진 상태) */
        .card-front {
            background: linear-gradient(135deg, #2c3e50, #000000);
            background-image: radial-gradient(rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 10px 10px;
        }
        
        .card-front::after {
            content: '?';
            font-size: 60px;
            color: rgba(255,255,255,0.2);
            font-weight: bold;
        }

        /* 카드 앞면 (결과) */
        .card-back {
            background: rgba(25, 30, 40, 0.95);
            transform: rotateY(180deg);
            backdrop-filter: blur(10px);
        }

        .element-icon { font-size: 60px; margin-bottom: 10px; filter: drop-shadow(0 0 10px currentColor); }
        .power-number { font-size: 48px; font-weight: 900; line-height: 1; }

        /* 속성별 컬러 테마 */
        .card-back.fire { color: var(--fire-color); border-color: var(--fire-color); box-shadow: 0 0 20px rgba(255, 71, 87, 0.4); }
        .card-back.water { color: var(--water-color); border-color: var(--water-color); box-shadow: 0 0 20px rgba(30, 144, 255, 0.4); }
        .card-back.earth { color: var(--earth-color); border-color: var(--earth-color); box-shadow: 0 0 20px rgba(46, 213, 115, 0.4); }

        /* 중앙 컨트롤 영역 (Glassmorphism) */
        .center-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 20px 40px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 350px;
        }

        .message {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #f1f2f6;
            min-height: 30px;
        }

        button {
            padding: 15px 40px;
            font-size: 22px;
            font-weight: 900;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 114, 255, 0.3);
            transition: all 0.2s;
            text-transform: uppercase;
            width: 100%;
        }

        button:active { transform: scale(0.95); }
        button:disabled { background: #576574; box-shadow: none; color: #a4b0be; pointer-events: none; }

        /* 승리 시 흔들림 애니메이션 */
        @keyframes winnerPop {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.15); }
            100% { transform: rotateY(180deg) scale(1.1); }
        }
        .winner-card .card-inner { animation: winnerPop 0.5s forwards; }

    </style>
</head>
<body>

    <div class="game-board">
        <!-- Player 2 (Top) -->
        <div class="player-area player2" id="p2Area">
            <div class="score-board">P2 SCORE: <span id="score2">0</span></div>
            <div class="card-container" id="cardCont2">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back" id="cardBack2">
                        <div class="element-icon" id="icon2"></div>
                        <div class="power-number" id="num2"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Center Arena -->
        <div class="center-area">
            <div class="message" id="gameMessage">P1 카드를 뽑으세요</div>
            <button id="actionBtn" onclick="playTurn()">P1 DRAW</button>
        </div>

        <!-- Player 1 (Bottom) -->
        <div class="player-area player1 active-turn" id="p1Area">
            <div class="card-container" id="cardCont1">
                <div class="card-inner">
                    <div class="card-front"></div>
                    <div class="card-back" id="cardBack1">
                        <div class="element-icon" id="icon1"></div>
                        <div class="power-number" id="num1"></div>
                    </div>
                </div>
            </div>
            <div class="score-board">P1 SCORE: <span id="score1">0</span></div>
        </div>
    </div>

    <script>
        // 게임 데이터 정의
        const elements = [
            { type: 'fire', icon: '🔥', beats: 'earth' },
            { type: 'water', icon: '💧', beats: 'fire' },
            { type: 'earth', icon: '🌿', beats: 'water' }
        ];

        let p1Score = 0;
        let p2Score = 0;
        let p1Card = null;
        let p2Card = null;
        let currentTurn = 1;

        // DOM 요소
        const actionBtn = document.getElementById('actionBtn');
        const gameMessage = document.getElementById('gameMessage');
        const cont1 = document.getElementById('cardCont1');
        const cont2 = document.getElementById('cardCont2');
        const back1 = document.getElementById('cardBack1');
        const back2 = document.getElementById('cardBack2');
        const p1Area = document.getElementById('p1Area');
        const p2Area = document.getElementById('p2Area');

        // 랜덤 카드 생성 (속성 + 1~10 숫자)
        function generateCard() {
            const randomElement = elements[Math.floor(Math.random() * elements.length)];
            return {
                type: randomElement.type,
                icon: randomElement.icon,
                beats: randomElement.beats,
                power: Math.floor(Math.random() * 10) + 1
            };
        }

        function resetBoard() {
            cont1.classList.remove('revealed', 'winner-card');
            cont2.classList.remove('revealed', 'winner-card');
            // 이전 속성 클래스 제거
            back1.className = 'card-back';
            back2.className = 'card-back';
        }

        // 턴 진행 로직
        function playTurn() {
            if (currentTurn === 1) {
                resetBoard();
                
                // P1 카드 생성 및 렌더링 (아직 뒤집지 않음)
                p1Card = generateCard();
                document.getElementById('icon1').textContent = p1Card.icon;
                document.getElementById('num1').textContent = p1Card.power;
                back1.classList.add(p1Card.type);

                // P1 카드 뒤집기 애니메이션 실행
                cont1.classList.add('revealed');
                
                gameMessage.textContent = "P2 차례입니다";
                actionBtn.textContent = "P2 DRAW";
                actionBtn.style.background = "linear-gradient(135deg, #ff4757, #ff6b81)"; // 버튼 색상 변경
                
                p1Area.classList.remove('active-turn');
                p2Area.classList.add('active-turn');
                
                currentTurn = 2;

            } else if (currentTurn === 2) {
                // P2 카드 생성 및 렌더링
                p2Card = generateCard();
                document.getElementById('icon2').textContent = p2Card.icon;
                document.getElementById('num2').textContent = p2Card.power;
                back2.classList.add(p2Card.type);

                cont2.classList.add('revealed');
                actionBtn.disabled = true;
                gameMessage.textContent = "BATTLE!";
                
                // 카드가 완전히 뒤집힌 후(0.6초) 승패 계산
                setTimeout(() => {
                    resolveBattle();
                }, 800);
            }
        }

        // 승패 판정 로직
        function resolveBattle() {
            let winner = 0; // 0: 무승부, 1: P1 승, 2: P2 승
            let reason = "";

            // 1. 속성 상성 체크
            if (p1Card.beats === p2Card.type) {
                winner = 1;
                reason = "속성 상성 승리!";
            } else if (p2Card.beats === p1Card.type) {
                winner = 2;
                reason = "속성 상성 승리!";
            } else {
                // 2. 속성이 같으면 숫자 비교
                if (p1Card.power > p2Card.power) {
                    winner = 1;
                    reason = "파워 승리!";
                } else if (p2Card.power > p1Card.power) {
                    winner = 2;
                    reason = "파워 승리!";
                } else {
                    reason = "완벽한 무승부!";
                }
            }

            // 결과 적용
            if (winner === 1) {
                gameMessage.textContent = `P1 승리! (${reason})`;
                p1Score++;
                document.getElementById('score1').textContent = p1Score;
                cont1.classList.add('winner-card');
            } else if (winner === 2) {
                gameMessage.textContent = `P2 승리! (${reason})`;
                p2Score++;
                document.getElementById('score2').textContent = p2Score;
                cont2.classList.add('winner-card');
            } else {
                gameMessage.textContent = reason;
            }

            // 다음 라운드 대기
            setTimeout(() => {
                gameMessage.textContent = "다음 라운드! P1 뽑으세요";
                actionBtn.textContent = "P1 DRAW";
                actionBtn.style.background = "linear-gradient(135deg, #00c6ff, #0072ff)";
                actionBtn.disabled = false;
                
                p2Area.classList.remove('active-turn');
                p1Area.classList.add('active-turn');
                
                currentTurn = 1;
            }, 2000);
        }
    </script>
</body>
</html>
