<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2P 카드 듀얼 배틀</title>
    <style>
        :root {
            --p1-color: #ff4757;
            --p2-color: #1e90ff;
            --bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 메인 게임 판 */
        .board {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* 플레이어 구역 */
        .player-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 15px;
            transition: opacity 0.3s;
        }

        .p2-zone {
            transform: rotate(180deg);
            border-bottom: 2px dashed rgba(255, 255, 255, 0.1);
        }

        .p1-zone {
            border-top: 2px dashed rgba(255, 255, 255, 0.1);
        }

        .disabled-turn {
            opacity: 0.4;
            pointer-events: none;
        }

        /* HP 바 및 정보 */
        .status-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hp-background {
            flex: 1;
            height: 20px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .hp-fill {
            height: 100%;
            width: 100%;
            transition: width 0.4s ease;
        }

        .p1-zone .hp-fill { background: var(--p1-color); }
        .p2-zone .hp-fill { background: var(--p2-color); }

        .hp-text {
            font-size: 18px;
            font-weight: bold;
            min-width: 70px;
        }

        /* 손패 덱 */
        .hand-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            width: 100%;
        }

        /* 카드 스타일 */
        .card {
            width: 95px;
            height: 135px;
            background: #1e293b;
            border-radius: 12px;
            border: 2px solid #475569;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 5px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            transition: transform 0.15s, border-color 0.15s;
        }

        .card:active {
            transform: scale(0.92);
        }

        /* 카드 종류별 테마 */
        .card[data-type="attack"] { border-color: #ff4757; }
        .card[data-type="shield"] { border-color: #1e90ff; }
        .card[data-type="heal"] { border-color: #2ed573; }
        .card[data-type="crit"] { border-color: #ffa502; }

        .card-icon { font-size: 32px; }
        .card-name { font-size: 13px; font-weight: bold; }
        .card-desc { font-size: 11px; color: #cbd5e1; text-align: center; }

        /* 중앙 알림판 */
        .center-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            padding: 15px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            width: 280px;
        }

        .log-text {
            font-size: 16px;
            font-weight: bold;
            color: #f8fafc;
        }

        /* 게임 오버 레이어 */
        .game-over {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            gap: 20px;
        }

        .game-over h1 { font-size: 40px; }
        .restart-btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            background: #2ed573;
            border: none;
            border-radius: 30px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="board">
        <!-- P2 영역 -->
        <div class="player-zone p2-zone disabled-turn" id="p2Zone">
            <div class="status-bar">
                <span class="hp-text">P2 HP</span>
                <div class="hp-background"><div class="hp-fill" id="p2HpFill"></div></div>
                <span class="hp-text" id="p2HpText">30/30</span>
            </div>
            <div class="hand-container" id="p2Hand"></div>
        </div>

        <!-- 중앙 알림판 -->
        <div class="center-hud">
            <div class="log-text" id="logMsg">P1 차례입니다! 카드를 내세요.</div>
        </div>

        <!-- P1 영역 -->
        <div class="player-zone p1-zone" id="p1Zone">
            <div class="hand-container" id="p1Hand"></div>
            <div class="status-bar">
                <span class="hp-text">P1 HP</span>
                <div class="hp-background"><div class="hp-fill" id="p1HpFill"></div></div>
                <span class="hp-text" id="p1HpText">30/30</span>
            </div>
        </div>
    </div>

    <!-- 승리 화면 (기본 숨김) -->
    <div class="game-over" id="gameOver" style="display: none;">
        <h1 id="winnerText">Player 1 승리!</h1>
        <button class="restart-btn" onclick="initGame()">다시 하기</button>
    </div>

    <script>
        const MAX_HP = 30;
        let p1Hp, p2Hp, currentTurn, p1Shield, p2Shield;
        let p1Hand = [], p2Hand = [];

        // 카드 데이터베이스
        const CARD_TYPES = [
            { type: 'attack', icon: '⚔️', name: '공격', desc: '상대에게 6 데미지' },
            { type: 'attack', icon: '⚔️', name: '공격', desc: '상대에게 6 데미지' },
            { type: 'shield', icon: '🛡️', name: '방어', desc: '다음 데미지 무효' },
            { type: 'heal', icon: '🧪', name: '회복', desc: '내 HP +5 회복' },
            { type: 'crit', icon: '💥', name: '강격', desc: '상대에게 11 데미지' }
        ];

        function getRandomCard() {
            return CARD_TYPES[Math.floor(Math.random() * CARD_TYPES.length)];
        }

        function initGame() {
            p1Hp = MAX_HP;
            p2Hp = MAX_HP;
            currentTurn = 1;
            p1Shield = false;
            p2Shield = false;

            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('logMsg').textContent = "P1 차례입니다! 카드를 내세요.";

            // 초기 손패 3장씩 지급
            p1Hand = [getRandomCard(), getRandomCard(), getRandomCard()];
            p2Hand = [getRandomCard(), getRandomCard(), getRandomCard()];

            updateUI();
        }

        function renderHand(player, handArray, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            handArray.forEach((card, index) => {
                const el = document.createElement('div');
                el.className = 'card';
                el.setAttribute('data-type', card.type);
                el.innerHTML = `
                    <div class="card-icon">${card.icon}</div>
                    <div class="card-name">${card.name}</div>
                    <div class="card-desc">${card.desc}</div>
                `;
                el.onclick = () => playCard(player, index);
                container.appendChild(el);
            });
        }

        function playCard(player, index) {
            if (player !== currentTurn) return;

            const hand = (player === 1) ? p1Hand : p2Hand;
            const playedCard = hand[index];
            let log = `P${player}: [${playedCard.name}] 사용! `;

            // 카드 효과 처리
            if (playedCard.type === 'attack') {
                log += applyDamage(player === 1 ? 2 : 1, 6);
            } else if (playedCard.type === 'crit') {
                log += applyDamage(player === 1 ? 2 : 1, 11);
            } else if (playedCard.type === 'shield') {
                if (player === 1) p1Shield = true;
                else p2Shield = true;
                log += "방어막 생성!";
            } else if (playedCard.type === 'heal') {
                if (player === 1) p1Hp = Math.min(MAX_HP, p1Hp + 5);
                else p2Hp = Math.min(MAX_HP, p2Hp + 5);
                log += "HP +5 회복!";
            }

            // 사용한 카드 보충
            hand[index] = getRandomCard();

            // 턴 교체
            currentTurn = (currentTurn === 1) ? 2 : 1;
            document.getElementById('logMsg').textContent = log;

            updateUI();
            checkGameOver();
        }

        function applyDamage(targetPlayer, amount) {
            if (targetPlayer === 1) {
                if (p1Shield) {
                    p1Shield = false;
                    return "P1이 데미지를 막았습니다!";
                }
                p1Hp = Math.max(0, p1Hp - amount);
            } else {
                if (p2Shield) {
                    p2Shield = false;
                    return "P2가 데미지를 막았습니다!";
                }
                p2Hp = Math.max(0, p2Hp - amount);
            }
            return `데미지 -${amount}!`;
        }

        function updateUI() {
            // HP 업데이트
            document.getElementById('p1HpText').textContent = `${p1Hp}/${MAX_HP}`;
            document.getElementById('p2HpText').textContent = `${p2Hp}/${MAX_HP}`;
            document.getElementById('p1HpFill').style.width = `${(p1Hp / MAX_HP) * 100}%`;
            document.getElementById('p2HpFill').style.width = `${(p2Hp / MAX_HP) * 100}%`;

            // 손패 렌더링
            renderHand(1, p1Hand, 'p1Hand');
            renderHand(2, p2Hand, 'p2Hand');

            // 턴 비활성화 처리
            const p1Zone = document.getElementById('p1Zone');
            const p2Zone = document.getElementById('p2Zone');

            if (currentTurn === 1) {
                p1Zone.classList.remove('disabled-turn');
                p2Zone.classList.add('disabled-turn');
            } else {
                p2Zone.classList.remove('disabled-turn');
                p1Zone.classList.add('disabled-turn');
            }
        }

        function checkGameOver() {
            if (p1Hp <= 0 || p2Hp <= 0) {
                const gameOver = document.getElementById('gameOver');
                const winnerText = document.getElementById('winnerText');
                winnerText.textContent = p1Hp <= 0 ? "Player 2 최종 승리!" : "Player 1 최종 승리!";
                gameOver.style.display = 'flex';
            }
        }

        // 게임 시작
        initGame();
    </script>
</body>
</html>
