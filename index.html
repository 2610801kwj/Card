<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2인용 태블릿 맞고</title>
    <style>
        :root {
            --bg-mat: #0a401b;
            --card-red: #c0392b;
            --card-bg: #fffbf0;
            --p1-col: #ff4757;
            --p2-col: #1e90ff;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: 'Pretendard', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: radial-gradient(circle, #135227 0%, var(--bg-mat) 100%);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .board {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            padding: 10px;
        }

        /* 플레이어 구역 */
        .player-zone {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            transition: opacity 0.3s;
        }

        .p2-zone { transform: rotate(180deg); }
        .disabled { opacity: 0.4; pointer-events: none; }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
            padding: 0 5px;
        }

        .hand {
            display: flex;
            gap: 6px;
            justify-content: center;
            min-height: 80px;
            flex-wrap: wrap;
        }

        /* 획득한 패 (점수판) */
        .captured-box {
            display: flex;
            gap: 12px;
            font-size: 12px;
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 8px;
        }

        /* 화투 카드 스타일 */
        .card {
            width: 50px;
            height: 75px;
            background-color: var(--card-bg);
            border-radius: 6px;
            border: 2px solid #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 4px 2px;
            color: #111;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            cursor: pointer;
            position: relative;
        }

        .card.back {
            background: linear-gradient(135deg, var(--card-red) 0%, #880e4f 100%);
            border-color: #ffd700;
        }
        .card.back * { display: none; }

        .card-month { font-size: 12px; font-weight: 900; color: var(--card-red); }
        .card-icon { font-size: 20px; }
        .card-type {
            font-size: 9px;
            font-weight: bold;
            padding: 1px 3px;
            border-radius: 3px;
            background: #e2e8f0;
        }
        .card-type.kwang { background: #ffd700; color: #000; }

        /* 바닥 판 */
        .center-board {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .field {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            min-height: 80px;
            width: 100%;
        }

        .msg {
            font-size: 15px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            gap: 20px;
        }
        .overlay h1 { font-size: 36px; color: #ffd700; }
        .btn { padding: 12px 30px; font-size: 18px; font-weight: bold; background: var(--p1-col); border: none; border-radius: 25px; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="board">
        <!-- P2 (상단, 180도 회전) -->
        <div class="player-zone p2-zone" id="p2Zone">
            <div class="info-bar">
                <span>PLAYER 2</span>
                <div class="captured-box">
                    <span>광:<b id="p2Kwang">0</b></span>
                    <span>열:<b id="p2Yul">0</b></span>
                    <span>띠:<b id="p2Tti">0</b></span>
                    <span>피:<b id="p2Pi">0</b></span>
                </div>
                <span>점수: <span id="p2Score" style="color:#ffd700">0</span>점</span>
            </div>
            <div class="hand" id="p2Hand"></div>
        </div>

        <!-- 바닥 판 -->
        <div class="center-board">
            <div class="msg" id="msg">P1 차례입니다. 패를 내세요!</div>
            <div class="field" id="field"></div>
            <div style="font-size: 11px; color: #aaa;">남은 덱: <span id="deckCnt">0</span>장</div>
        </div>

        <!-- P1 (하단) -->
        <div class="player-zone p1-zone" id="p1Zone">
            <div class="hand" id="p1Hand"></div>
            <div class="info-bar">
                <span>PLAYER 1</span>
                <div class="captured-box">
                    <span>광:<b id="p1Kwang">0</b></span>
                    <span>열:<b id="p1Yul">0</b></span>
                    <span>띠:<b id="p1Tti">0</b></span>
                    <span>피:<b id="p1Pi">0</b></span>
                </div>
                <span>점수: <span id="p1Score" style="color:#ffd700">0</span>점</span>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay" style="display:none;">
        <h1 id="winnerText">게임 종료</h1>
        <button class="btn" onclick="initGame()">다시 하기</button>
    </div>

    <script>
        const MONTH_ICONS = ['🌸','🍃','🌙','🐦','🌾','🍁','📜','🦌','🍷','🎴','🎄','🎁'];
        let deck = [], field = [], p1Hand = [], p2Hand = [];
        let p1Cap = [], p2Cap = [];
        let turn = 1;

        // 화투 48장덱 생성 (월별 4장: 광, 십끗, 띠, 피)
        function createDeck() {
            let cards = [];
            for (let m = 1; m <= 12; m++) {
                const icon = MONTH_ICONS[m-1];
                // 각 월의 구성 (광, 열, 띠, 피)
                let types = ['피', '피', '띠', '열'];
                if ([1, 3, 8, 11, 12].includes(m)) types[0] = '광';
                
                types.forEach((t, i) => {
                    cards.push({ month: m, icon: icon, type: t, id: Math.random() });
                });
            }
            return cards.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            deck = createDeck();
            p1Cap = []; p2Cap = [];
            turn = 1;

            // 맞고 정통 분배: 각 10장, 바닥 8장, 덱 20장
            p1Hand = deck.splice(0, 10);
            p2Hand = deck.splice(0, 10);
            field = deck.splice(0, 8);

            document.getElementById('overlay').style.display = 'none';
            document.getElementById('msg').textContent = "P1 차례입니다. 패를 내세요!";
            render();
        }

        function renderCard(card, isBack, onClick) {
            const el = document.createElement('div');
            el.className = `card ${isBack ? 'back' : ''}`;
            if (!isBack) {
                const isKwang = card.type === '광';
                el.innerHTML = `
                    <div class="card-month">${card.month}월</div>
                    <div class="card-icon">${card.icon}</div>
                    <div class="card-type ${isKwang ? 'kwang' : ''}">${card.type}</div>
                `;
            }
            if (onClick) el.onclick = onClick;
            return el;
        }

        function render() {
            // 바닥패
            const fieldEl = document.getElementById('field');
            fieldEl.innerHTML = '';
            field.forEach(c => fieldEl.appendChild(renderCard(c, false)));

            // P1 손패
            const p1El = document.getElementById('p1Hand');
            p1El.innerHTML = '';
            p1Hand.forEach((c, i) => p1El.appendChild(renderCard(c, false, () => playTurn(1, i))));

            // P2 손패
            const p2El = document.getElementById('p2Hand');
            p2El.innerHTML = '';
            p2Hand.forEach((c, i) => p2El.appendChild(renderCard(c, false, () => playTurn(2, i))));

            // 점수 및 획득 패 갱신
            updateStats(1, p1Cap);
            updateStats(2, p2Cap);
            document.getElementById('deckCnt').textContent = deck.length;

            // 턴 처리
            document.getElementById('p1Zone').classList.toggle('disabled', turn !== 1);
            document.getElementById('p2Zone').classList.toggle('disabled', turn !== 2);
        }

        function updateStats(pNum, capList) {
            const counts = { '광': 0, '열': 0, '띠': 0, '피': 0 };
            capList.forEach(c => counts[c.type]++);

            document.getElementById(`p${pNum}Kwang`).textContent = counts['광'];
            document.getElementById(`p${pNum}Yul`).textContent = counts['열'];
            document.getElementById(`p${pNum}Tti`).textContent = counts['띠'];
            document.getElementById(`p${pNum}Pi`).textContent = counts['피'];

            // 점수 공식: 광(3장=3점, 4장=4점, 5장=15점), 열/띠/피는 기준치 이상 시 +1점씩
            let score = 0;
            if (counts['광'] === 5) score += 15;
            else if (counts['광'] >= 3) score += counts['광'];
            if (counts['열'] >= 5) score += (counts['열'] - 4);
            if (counts['띠'] >= 5) score += (counts['띠'] - 4);
            if (counts['피'] >= 10) score += (counts['피'] - 9);

            document.getElementById(`p${pNum}Score`).textContent = score;
        }

        function playTurn(pNum, handIdx) {
            if (pNum !== turn) return;

            const hand = pNum === 1 ? p1Hand : p2Hand;
            const cap = pNum === 1 ? p1Cap : p2Cap;
            const card = hand.splice(handIdx, 1)[0];

            let text = `P${pNum}: ${card.month}월 제출! `;

            // 1. 손패 매칭
            const fIdx = field.findIndex(c => c.month === card.month);
            if (fIdx !== -1) {
                cap.push(card, field.splice(fIdx, 1)[0]);
                text += "바닥 패 획득! ";
            } else {
                field.push(card);
            }

            // 2. 덱에서 뒤집기
            if (deck.length > 0) {
                const dCard = deck.pop();
                const dfIdx = field.findIndex(c => c.month === dCard.month);
                if (dfIdx !== -1) {
                    cap.push(dCard, field.splice(dfIdx, 1)[0]);
                    text += `[덱 뒤집기] ${dCard.month}월 추가 획득!`;
                } else {
                    field.push(dCard);
                }
            }

            turn = turn === 1 ? 2 : 1;
            document.getElementById('msg').textContent = text;
            render();
            checkEnd();
        }

        function checkEnd() {
            if (p1Hand.length === 0 && p2Hand.length === 0) {
                const s1 = parseInt(document.getElementById('p1Score').textContent);
                const s2 = parseInt(document.getElementById('p2Score').textContent);
                const winEl = document.getElementById('winnerText');

                if (s1 > s2) winEl.textContent = `Player 1 승리! (${s1}점)`;
                else if (s2 > s1) winEl.textContent = `Player 2 승리! (${s2}점)`;
                else winEl.textContent = `무승부! (${s1}점)`;

                document.getElementById('overlay').style.display = 'flex';
            }
        }

        initGame();
    </script>
</body>
</html>
